    <meta charset="UTF-8" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!-- <script src="//cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script> -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("pistis-theme");
          if (t !== "dark" && t !== "light") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          var r = document.documentElement;
          r.classList.toggle("dark", t === "dark");
          r.dataset.theme = t;
          r.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
    <title>Pistis Trybe</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
